services:
  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data
    networks:
      - data

  postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    restart: unless-stopped
    environment:
      POSTGRES_USER: scanr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: scanr
    # Docker's 64MB default /dev/shm is too small for Postgres parallel workers:
    # a manual VACUUM (ANALYZE) on a multi-GB findings table fails with "could
    # not resize shared memory segment". Autovacuum never goes parallel so normal
    # operation is unaffected — this is for the ops runbook.
    shm_size: 1gb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scanr -d scanr"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data

  api:
    image: ghcr.io/t3rr0or/scanr-api:${SCANR_VERSION:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/system/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PROCESS_ROLE: api
      DATABASE_URL: postgresql+asyncpg://scanr:${POSTGRES_PASSWORD}@postgres/scanr
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in .env}
      VAULT_KEY: ${VAULT_KEY:?VAULT_KEY must be set in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@scanr.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set in .env}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost}
      SECURE_COOKIES: ${SECURE_COOKIES:-true}
      DEVELOPMENT_MODE: ${DEVELOPMENT_MODE:-false}
      SCAN_TARGET_DENYLIST: ${SCAN_TARGET_DENYLIST:-localhost,postgres,redis,db,api,frontend,scan-worker,ai-worker,control-worker,browser,sandbox-runner,scanr-api,scanr-worker}
      # The frontend nginx proxies /api and /ws, so the API's direct peer is
      # always a container on the Docker network. Without trusting it, every
      # client is rate-limited under nginx's IP as a single shared bucket.
      # 172.16.0.0/12 covers Docker's default bridge pools. Narrow this if you
      # expose the API directly via SCANR_API_BIND. See .env.example.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.16.0.0/12}
      # /docs, /redoc and /openapi.json are unauthenticated and publish the whole
      # API surface. Off by default here since this is the deployment that can be
      # exposed; set DOCS_ENABLED=true in .env if you want them.
      DOCS_ENABLED: ${DOCS_ENABLED:-false}
      # Self-update is OFF by default. It requires mounting the host Docker
      # socket into the API container, which grants it root-equivalent control
      # of the host. Enable it only via the docker-compose.self-update.yml
      # override, which adds the socket and project-directory mounts for
      # trusted, admin-only deployments. The base compose file does NOT mount
      # the Docker socket into the API container.
      SELF_UPDATE_ENABLED: ${SELF_UPDATE_ENABLED:-false}
      WORDLIST_DIR: /app/wordlists
      # Assist-mode AI requests execute in the API; autonomous agent work is
      # queued to ai-worker, so the API receives no sandbox/browser tokens.
      AI_PROVIDER: ${AI_PROVIDER:-anthropic}
      AI_MODEL: ${AI_MODEL:-}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-2048}
      AI_RATE_LIMIT_TOKENS_PER_MIN: ${AI_RATE_LIMIT_TOKENS_PER_MIN:-0}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    volumes:
      - reports_data:/app/reports
      - nvd_data:/app/nvd_cache
      - wordlists_data:/app/wordlists
    # Bind to localhost by default — the frontend nginx proxies /api and /ws.
    # Set SCANR_API_BIND=0.0.0.0 in .env only if you need direct API access.
    ports:
      - "${SCANR_API_BIND:-127.0.0.1}:8000:8000"
    networks:
      - frontend
      - data
      - api_egress
    command: uvicorn scanr.main:app --host 0.0.0.0 --port 8000

  # Scanner/retest consumer. It can reach scan targets and the isolated browser,
  # but receives no JWT/admin/provider/sandbox-control credentials.
  scan-worker:
    image: ghcr.io/t3rr0or/scanr-worker:${SCANR_VERSION:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Wait for the API to be healthy: only the API runs DB migrations (app
      # lifespan), so the worker must not start against an unmigrated schema.
      api:
        condition: service_healthy
      browser:
        condition: service_healthy
    environment:
      PROCESS_ROLE: scan-worker
      DATABASE_URL: postgresql+asyncpg://scanr:${POSTGRES_PASSWORD}@postgres/scanr
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      VAULT_KEY: ${VAULT_KEY:?VAULT_KEY must be set in .env}
      WORDLIST_DIR: /app/wordlists
      PROXY_URL: ${PROXY_URL:-}
      SCAN_TARGET_DENYLIST: ${SCAN_TARGET_DENYLIST:-localhost,postgres,redis,db,api,frontend,scan-worker,ai-worker,control-worker,browser,sandbox-runner,scanr-api,scanr-worker}
      MAX_CONCURRENT_HOSTS: ${MAX_CONCURRENT_HOSTS:-50}
      MAX_CONCURRENT_PLUGINS: ${MAX_CONCURRENT_PLUGINS:-20}
      DEFAULT_SCAN_TIMEOUT: ${DEFAULT_SCAN_TIMEOUT:-3600}
      SCAN_HEARTBEAT_TIMEOUT: ${SCAN_HEARTBEAT_TIMEOUT:-300}
      BROWSER_SERVICE_URL: http://browser:8091
      BROWSER_SERVICE_TOKEN: ${BROWSER_SERVICE_TOKEN:?BROWSER_SERVICE_TOKEN must be set in .env}
      SCANR_REQUIRE_BROWSER_SERVICE: "true"
      # Extra CA trusted for authenticated LDAP, e.g. /app/certs/ldap-ca.pem
      LDAP_CA_FILE: ${LDAP_CA_FILE:-}
    cap_add:
      - NET_RAW
    volumes:
      - reports_data:/app/reports
      - nvd_data:/app/nvd_cache
      - wordlists_data:/app/wordlists
      - ./certs:/app/certs:ro
    networks:
      - data
      - browser_control
      - scan_egress
    command:
      [
        "celery",
        "-A",
        "scanr.tasks.celery_app",
        "worker",
        "--loglevel=info",
        "--concurrency=${SCAN_WORKER_CONCURRENCY:-4}",
        "-Q",
        "scan",
      ]

  # Autonomous/guided agent consumer. Provider, vault, browser and sandbox
  # credentials exist only here (and provider/vault settings needed by the API).
  ai-worker:
    image: ghcr.io/t3rr0or/scanr-worker:${SCANR_VERSION:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
      browser:
        condition: service_healthy
      sandbox-runner:
        condition: service_healthy
    environment:
      PROCESS_ROLE: ai-worker
      DATABASE_URL: postgresql+asyncpg://scanr:${POSTGRES_PASSWORD}@postgres/scanr
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      VAULT_KEY: ${VAULT_KEY:?VAULT_KEY must be set in .env}
      WORDLIST_DIR: /app/wordlists
      PROXY_URL: ${PROXY_URL:-}
      SCAN_TARGET_DENYLIST: ${SCAN_TARGET_DENYLIST:-localhost,postgres,redis,db,api,frontend,scan-worker,ai-worker,control-worker,browser,sandbox-runner,scanr-api,scanr-worker}
      AI_PROVIDER: ${AI_PROVIDER:-anthropic}
      AI_MODEL: ${AI_MODEL:-}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-2048}
      AI_RATE_LIMIT_TOKENS_PER_MIN: ${AI_RATE_LIMIT_TOKENS_PER_MIN:-0}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      SANDBOX_RUNNER_URL: ${SANDBOX_RUNNER_URL:-http://sandbox-runner:8090}
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:?SANDBOX_TOKEN must be set in .env}
      SANDBOX_CMD_TIMEOUT: ${SANDBOX_CMD_TIMEOUT:-120}
      BROWSER_SERVICE_URL: http://browser:8091
      BROWSER_SERVICE_TOKEN: ${BROWSER_SERVICE_TOKEN:?BROWSER_SERVICE_TOKEN must be set in .env}
      SCANR_REQUIRE_BROWSER_SERVICE: "true"
    cap_add:
      - NET_RAW
    volumes:
      - reports_data:/app/reports
      - nvd_data:/app/nvd_cache
      - wordlists_data:/app/wordlists
    networks:
      - data
      - browser_control
      - sandbox_control
      - scan_egress
    command:
      [
        "celery",
        "-A",
        "scanr.tasks.celery_app",
        "worker",
        "--loglevel=info",
        "--concurrency=${AI_WORKER_CONCURRENCY:-2}",
        "-Q",
        "ai",
      ]

  # Reports, schedules and watchdogs need the database and broker only. Beat is
  # colocated with this control consumer and publishes every periodic task to
  # the explicit control queue.
  control-worker:
    image: ghcr.io/t3rr0or/scanr-worker:${SCANR_VERSION:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      PROCESS_ROLE: control-worker
      DATABASE_URL: postgresql+asyncpg://scanr:${POSTGRES_PASSWORD}@postgres/scanr
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      SCAN_TARGET_DENYLIST: ${SCAN_TARGET_DENYLIST:-localhost,postgres,redis,db,api,frontend,scan-worker,ai-worker,control-worker,browser,sandbox-runner,scanr-api,scanr-worker}
      SCAN_HEARTBEAT_TIMEOUT: ${SCAN_HEARTBEAT_TIMEOUT:-300}
      AI_AGENT_HEARTBEAT_TIMEOUT: ${AI_AGENT_HEARTBEAT_TIMEOUT:-900}
    volumes:
      - reports_data:/app/reports
    networks:
      - data
    command:
      [
        "celery",
        "-A",
        "scanr.tasks.celery_app",
        "worker",
        "--beat",
        "--schedule=/tmp/celerybeat-schedule",
        "--loglevel=info",
        "--concurrency=${CONTROL_WORKER_CONCURRENCY:-2}",
        "-Q",
        "control",
      ]

  # Chromium is isolated from every application/data secret. Secret-bearing
  # workers reach its authenticated API over the internal control network; only
  # this sidecar renders hostile target content on scan_egress.
  browser:
    image: ghcr.io/t3rr0or/scanr-browser:${SCANR_VERSION:-latest}
    build:
      context: ./backend
      dockerfile: sandbox/Dockerfile.browser
    restart: unless-stopped
    init: true
    environment:
      BROWSER_SERVICE_TOKEN: ${BROWSER_SERVICE_TOKEN:?BROWSER_SERVICE_TOKEN must be set in .env}
      BROWSER_VALIDATION_CONCURRENCY: ${BROWSER_VALIDATION_CONCURRENCY:-2}
      SCAN_TARGET_DENYLIST: ${SCAN_TARGET_DENYLIST:-localhost,postgres,redis,db,api,frontend,scan-worker,ai-worker,control-worker,browser,sandbox-runner,scanr-api,scanr-worker}
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: ${BROWSER_MEMORY_LIMIT:-1g}
    cpus: ${BROWSER_CPU_LIMIT:-2.0}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8091/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - browser_control
      - scan_egress
    command:
      [
        "uvicorn",
        "scanr.browser_service:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8091",
        "--no-access-log",
        "--limit-concurrency",
        "${BROWSER_REQUEST_LIMIT:-8}",
      ]

  frontend:
    image: ghcr.io/t3rr0or/scanr-frontend:${SCANR_VERSION:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      # Plain HTTP is loopback-only by default. Terminate public/LAN TLS in a
      # reverse proxy and forward to 127.0.0.1:80 (see README).
      - "${SCANR_UI_BIND:-127.0.0.1}:80:80"
    networks:
      - frontend
      - ingress

  # ── AI command-execution sandbox ──────────────────────────────────────────
  # Only the sandbox-runner gets the Docker socket; it holds NO ScanR secrets.
  # One persistent container per agent run (state survives between commands);
  # reaped at run end and by a max-lifetime backstop. Non-root, read-only
  # rootfs (writable tmpfs for /tmp,/work,HOME), cap-drop ALL, resource/time-
  # limited, no ScanR env.
  sandbox-runner:
    image: ghcr.io/t3rr0or/scanr-sandbox-runner:${SCANR_VERSION:-latest}
    build:
      context: ./backend
      dockerfile: sandbox/Dockerfile.runner
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:?SANDBOX_TOKEN must be set in .env}
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-ghcr.io/t3rr0or/scanr-sandbox:${SCANR_VERSION:-latest}}
      # The runner creates one internal network and one mirror proxy per run.
      # No sandbox shares an L2 segment or target relay with another run.
      SANDBOX_NETWORK_PREFIX: ${SANDBOX_NETWORK_PREFIX:-scanr-sbx-net}
      SANDBOX_PROXY_IMAGE: ${SANDBOX_PROXY_IMAGE:-ghcr.io/t3rr0or/scanr-sandbox-proxy:${SCANR_VERSION:-latest}}
      SANDBOX_PROXY_PORT: ${SANDBOX_PROXY_PORT:-8888}
      SANDBOX_MAX_LIFETIME: ${SANDBOX_MAX_LIFETIME:-3600}
      SANDBOX_MAX_SESSIONS: ${SANDBOX_MAX_SESSIONS:-8}
      # Per-run SOCKS5 egress relay, started only when a scan opts into target
      # egress. It is the one thing bridging scanr_sandbox (internal) and the
      # egress network, and it refuses any destination outside the scan's scope.
      SANDBOX_RELAY_IMAGE: ${SANDBOX_RELAY_IMAGE:-ghcr.io/t3rr0or/scanr-sandbox-relay:${SCANR_VERSION:-latest}}
      SANDBOX_EGRESS_NETWORK: scanr_sandbox_egress
      SANDBOX_RELAY_PORT: ${SANDBOX_RELAY_PORT:-1080}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # The runner holds a root-equivalent Docker socket, so only ai-worker may
    # reach it. It is never attached to a sandbox or egress network.
    networks:
      - sandbox_control
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Image-only service. The runner starts one allowlist proxy on each run's
  # private internal network, then attaches its egress leg. A shared long-lived
  # proxy/network would let separate agent runs discover each other.
  sandbox-proxy:
    image: ghcr.io/t3rr0or/scanr-sandbox-proxy:${SCANR_VERSION:-latest}
    build:
      context: ./backend
      dockerfile: sandbox/Dockerfile.proxy
    profiles: ["build-only"]

  # Per-run SOCKS5 egress relay image. Built here so `docker compose build`
  # produces it, but never *run* by compose: the runner starts one container per
  # agent run with that run's scope baked into its environment, and destroys it
  # with the session. A long-lived shared relay would mean one scope for every
  # scan, which is the opposite of the point.
  sandbox-relay:
    image: ghcr.io/t3rr0or/scanr-sandbox-relay:${SCANR_VERSION:-latest}
    build:
      context: ./backend
      dockerfile: sandbox/Dockerfile.relay
    profiles: ["build-only"]

volumes:
  redis_data:
  postgres_data:
  reports_data:
  nvd_data:
  wordlists_data:

networks:
  # Docker needs a non-internal network to publish nginx's host port. Keep
  # this separate from the internal API link and the data/worker networks.
  ingress:

  # Browser-facing nginx can reach only the API, never databases or workers.
  frontend:
    internal: true

  # Database/broker plane. Internal prevents data services and the control
  # consumer from acquiring an internet route.
  data:
    internal: true

  # Browser RPC plane. Only scan/AI consumers can call the secret-free renderer.
  browser_control:
    internal: true

  # Docker-runner RPC plane. Only ai-worker can reach this root-equivalent
  # service, and only with its dedicated token.
  sandbox_control:
    internal: true

  # General outbound network for the API's explicitly authorized integrations.
  api_egress:

  # Target/provider egress for scan, AI, and the secret-free browser sidecar.
  scan_egress:

  # Egress leg for per-run sandbox proxies/relays created via the Docker socket.
  # Sandboxed containers themselves are never attached here.
  sandbox_egress:
    name: scanr_sandbox_egress
    labels:
      scanr.sandbox.egress: "true"
